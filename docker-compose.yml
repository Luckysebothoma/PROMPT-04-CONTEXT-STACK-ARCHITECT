
services:
 
  api:
    build: .
    container_name: ai_gateway_4_of_10_api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STACK3_URL: ${STACK3_URL}
      PORT: ${PORT}
      HOST: ${HOST}
      LOG_LEVEL: ${LOG_LEVEL}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS}
      CONTEXT_MAX_MESSAGES: ${CONTEXT_MAX_MESSAGES}
    ports:
      - "${API_PORT_HOST}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 10
    networks:
      - ai-gateway-net
    restart: always



networks:
  ai-gateway-net:
    external: true
  databases:
    external: true
volumes:
  ai_gateway_4_of_10_pg_data:
  ai_gateway_4_of_10_grafana_data:
